---
# cPanel Git Version Control deployment ("Deploy HEAD Commit").
# Builds the Next.js site on the server and copies the standalone bundle
# into the Node.js app root used by "Setup Node.js App" (startup file: server.js).
#
# Requirements:
#   - Node.js app created in cPanel with Application root "qnvotech".
#   - The cPanel clone of this repo must have a clean working tree.
deployment:
  tasks:
    # Where the running app lives (Setup Node.js App > Application root).
    - export APPDIR="$HOME/qnvotech"
    # Use the Node.js 22 build that cPanel provides (CloudLinux or EasyApache path).
    - export PATH="/opt/alt/alt-nodejs22/root/usr/bin:/opt/cpanel/ea-nodejs22/bin:$PATH"
    - export NEXT_TELEMETRY_DISABLED=1
    # The repo must be cloned somewhere else (e.g. ~/repositories/qnvotech), not into the app root.
    - if [ "$(pwd -P)" = "$(cd "$APPDIR" 2>/dev/null && pwd -P)" ]; then echo "ERROR - clone the repo outside $APPDIR (e.g. ~/repositories/qnvotech)"; exit 1; fi

    # 1. Install dependencies (dev deps are needed for the build) and build.
    - npm ci --include=dev --no-audit --no-fund
    - npm run build

    # 2. Copy the standalone server, static assets and public files into the app root.
    - mkdir -p "$APPDIR/.next" "$APPDIR/public" "$APPDIR/tmp"
    - /bin/rsync -a --delete .next/standalone/node_modules/ "$APPDIR/node_modules/"
    - /bin/rsync -a --delete --exclude static .next/standalone/.next/ "$APPDIR/.next/"
    - /bin/rsync -a --delete .next/static/ "$APPDIR/.next/static/"
    - /bin/rsync -a --delete public/ "$APPDIR/public/"
    - /bin/cp -f .next/standalone/server.js .next/standalone/package.json "$APPDIR/"
    - if [ -f .env ]; then /bin/cp -f .env "$APPDIR/.env"; fi

    # LiteSpeed was returning 406/400 for /_next/static on a hard refresh (Accept: text/css
    # plus Cache-Control: no-cache), so the stylesheet never applied and the menu button
    # sat beside the logo. Copy the built files onto the public URL and disable MultiViews.
    - rm -rf "$APPDIR/_next/static" "$APPDIR/public/_next/static"
    - mkdir -p "$APPDIR/_next" "$APPDIR/public/_next"
    - /bin/cp -a "$APPDIR/.next/static" "$APPDIR/_next/static"
    - /bin/cp -a "$APPDIR/.next/static" "$APPDIR/public/_next/static"
    - touch "$APPDIR/.htaccess" "$APPDIR/public/.htaccess"
    - grep -q "QNVO-NEXT-STATIC" "$APPDIR/.htaccess" || printf '\n# QNVO-NEXT-STATIC\nOptions -MultiViews\n<IfModule mod_rewrite.c>\nRewriteEngine On\nRewriteRule ^_next/static/(.*)$ .next/static/$1 [L]\n</IfModule>\n' >> "$APPDIR/.htaccess"

    # 3. Restart the app (Passenger reloads when tmp/restart.txt changes).
    - /bin/touch "$APPDIR/tmp/restart.txt"
